views = {
	images = {
		icon = bi-grid-fill
	},
	list = {
		icon = bi-list-task
	},
	map = {
		icon = bi-globe
	}
}

# --- text for Browse menu item, default is "Browse" 
browse_menu_button_text = 

# --- Render browse menu as nav links? default is dropdown
render_browse_menu_as_links = 1

# --- default number of results per page/ajax load
defaultHitsPerBlock = 36

# --- set if you don't want the browse menu to be preloaded with facets for the first browse type on open
dontPreloadBrowseMenu = 1

# --------------------------------------------------------------------
# Configuration for occurrence browse
ca_occurrences = {
	name = _("Other authorities"),
	facets = {
		event_type_facet = {
			type = attribute,
			element_code = event_type,
			
			label_singular = _("Event Type"),
		},
		decade_facet = {
			type = normalizedDates,
			element_code = common_date,
			normalization = decades,
			
			group_mode = alphabetical,
			
			label_singular = _("Date"),
			label_plural = _("Date")
		},
		year_facet = {
			type = normalizedDates,
			element_code = common_date,
			normalization = years,
			
			group_mode = alphabetical,
			
			label_singular = _("Date"),
			label_plural = _("Date"),
			requires = decade_facet
		},
		season_facet = {
			type = attribute,
			element_code = ev_season,
			
			label_singular = _("Season"),
		},
		series_facet = {
			type = attribute,
			element_code = ev_primary_series,
			
			label_singular = _("Series"),
		},
		secondary_series_facet = {
			type = attribute,
			element_code = ev_secondary_series,
			
			label_singular = _("Secondary Series"),
			requires = x
		},
		location_facet = {
			type = attribute,
			element_code = ev_location,
			
			label_singular = _("Location"),
		},
		performer_facet = {
			# 'type' can equal authority, attribute, fieldList, normalizedDates
			type = authority,		
			table = ca_entities,
			relationship_table = ca_entities_x_occurrences,
			restrict_to_relationship_types = [performer],
			
			group_mode = alphabetical,
			
			natural_sort = 0,
			order_by_label_fields = [surname, forename, middlename],
			
			indefinite_article = an,
			label_singular = _("performer"),
			label_plural = _("performers")
		},
		center_facet = {
			# 'type' can equal authority, attribute, fieldList, normalizedDates
			type = authority,		
			table = ca_entities,
			relationship_table = ca_entities_x_occurrences,
			restrict_to_relationship_types = [center],
			
			group_mode = alphabetical,
			
			natural_sort = 0,
			order_by_label_fields = [surname, forename, middlename],
			
			indefinite_article = an,
			label_singular = _("center"),
			label_plural = _("centers")
		}
	}
}
# --------------------------------------------------------------------
# Configuration for entity browse
ca_entities = {
	name = _("Entities"),
	facets = {
		performer_facet = {
			type = has,
			
			table = ca_occurrences,
			relationship_table = ca_entities_x_occurrences,
			restrict_to_types = [],
			restrict_to_relationship_types = [performer],
			
			label_yes = _("Is a performer"),
			label_no = _("Is not a performer"),
			
			single_value = 1,
			
			label_singular = _("Performer?"),
			label_plural = _("Performers?")
		},
		center_facet = {
			type = has,
			
			table = ca_occurrences,
			relationship_table = ca_entities_x_occurrences,
			restrict_to_types = [],
			restrict_to_relationship_types = [center],
			
			label_yes = _("Is a center"),
			label_no = _("Is not a center"),
			
			single_value = 1,
			
			label_singular = _("Center?"),
			label_plural = _("Centers?")
		},
		event_type_facet = {
			type = attribute,
			element_code = event_type,
			relative_to = ca_occurrences,
			label_singular = _("Event Type"),
		},
		
	},
}