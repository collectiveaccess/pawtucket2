# Browse cache TTL
cache_timeout = 0

# BrowseTypes keys to include in general search. 
# This also controls the order blocks of results appear in general search
generalSearchTargets = [entities, objects]

# Available named browses
browseTypes = {
	objects = {
		displayName = _(Objects),
		labelSingular = _("object"),
 		labelPlural = _("objects"),
		table = ca_objects,
		restrictToTypes = [],
		dontShowInBrowseMenu = 0, # --- set to true or 1 to hide in main site navigation leave empty or 0 to display in menu
		
		#dontExpandTypesHierarchically = 1,
		availableFacets = [],
		
		# formats available for display of results
		# possible values are: images, list, map
		views = {
			images = {
				result_caption = "<div class='card-title'><small class='text-body-secondary'>^ca_objects.accession_num</small><div class='fw-medium lh-sm fs-5'><l>^ca_objects.preferred_labels</l><ifdef code='ca_objects.nomenclature'><br/>^ca_objects.nomenclature%delimiter=;_</ifdef><ifdef code='ca_objects.spec_common_name'><br/>^ca_objects.spec_common_name%delimiter=;_</ifdef><ifdef code='ca_objects.source_id'><br/>^ca_objects.source_id</ifdef></div></div>",
				image_format = cover, # --- contain or cover - default is cover
			},
			list = {
				result_caption = "<div class='card-title'><small class='text-body-secondary'>^ca_objects.accession_num</small><div class='fw-medium lh-sm fs-5'><l><b>^ca_objects.preferred_labels</b></l><ifdef code='ca_objects.nomenclature%delimiter=;_'><br/>^ca_objects.nomenclature</ifdef><ifdef code='ca_objects.spec_common_name'><br/>^ca_objects.spec_common_name%delimiter=;_</ifdef><br/><ifdef code='ca_objects.creator|ca_objects.manufacturer'><br/><b>Creator:</b> </ifdef><ifdef code='ca_objects.creator'>^ca_objects.creator (artist/maker) </ifdef><ifdef code=^ca_objects.manufacturer'>^ca_objects.manufacturer (manufacturer)</ifdef><ifdef code='ca_objects.culture'><br/><b>Culture: </b>^ca_objects.culture</ifdef><ifdef code='ca_objects.date_created'><br/><b>Creation Date: </b>^ca_objects.date_created</ifdef><ifdef code='ca_objects.date_collected'><br/><b>Collection Date: </b>^ca_objects.date_collected</ifdef><ifdef code='ca_objects.source_id'><br/><b>Contributor: </b>^ca_objects.source_id</ifdef></div></div>",
				image_format = contain, # --- contain or cover - default is cover
				list_format = image, # --- image or text where text is a simple grid of cards with no media
			},
			map = {
				mapAttributes = [ca_objects.origin_loc_geo],
				width = 100%,
				height = 600px,
				minZoomLevel = 2,
				maxZoomLevel = 18,
				mapItemInfoTemplate =  "<l><div class='fw-bold'>^ca_objects.preferred_labels.name</div></l></ifdef>"
			}
		},
		sortBy = {
			Accession = ca_objects.idno,
			Title = ca_object_labels.name
		},
		# --- default sort direction for the sortBy options
		sortDirection = {
			Identifier = asc,
			Title = desc
		},
#		options = {
#			selectMediaUsingRelationshipTypes = [relationshipType],
#			selectMediaUsingTypes = [objectType],
#			extendedInformationTemplate = ^ca_objects.description
#		},
		generalSearchOptions = {
			resultCaption = "<div class='card-title'><small class='text-body-secondary'>^ca_objects.accession_num</small><div class='fw-medium lh-sm fs-5'><l>^ca_objects.preferred_labels</l><ifdef code='ca_objects.nomenclature'><br/>^ca_objects.nomenclature%delimiter=;_</ifdef><ifdef code='ca_objects.spec_common_name'><br/>^ca_objects.spec_common_name%delimiter=;_</ifdef><ifdef code='ca_objects.source_id'><br/>^ca_objects.source_id</ifdef></div></div>",
			searchView = general_image_results_html.php,
			imageFormat = cover, # --- contain or cover - default is cover
			numItemsToShow = 8,
			sortBy = _natural,
			sortDirection = asc,
		},
#		baseCriteria = {
#			"has_media_facet" = [1]
#		},
#		showBaseCriteria = 1
	},
	entities = {
		displayName = _(Contributors),
		labelSingular = _("contributor"),
 		labelPlural = _("contributors"),
		table = ca_entities,
		restrictToTypes = [ins],
		dontShowInBrowseMenu = 0, # --- set to true or 1 to hide in main site navigation leave empty or 0 to display in menu
		showLetterBarFrom = ca_entity_labels.surname,
		showLetterBarSorts = [ca_entity_labels.surname;ca_entity_labels.forename],
		
		# formats available for display of results
		# possible values are: images, list, timeline, map
		views = {
			list = {
				#result_caption = "<div class='card-title text-center'><ifdef code='ca_entities.idno'><small class='text-body-secondary'><l>^ca_entities.idno</l></small></ifdef><div class='fw-medium lh-sm fs-5'><l>^ca_entities.preferred_labels</l></div></div>",
				result_caption = "<div class='card-title text-center'><div class='fw-medium lh-sm fs-5'>^ca_entities.preferred_labels</div></div><ifdef code='ca_entities.address'><div class='text-center fs-6'><ifdef code='ca_entities.address.city'>^ca_entities.address.city</ifdef><ifdef code='ca_entities.address.stateprovince'><ifdef code='ca_entities.address.city'>, </ifdef>^ca_entities.address.stateprovince</ifdef><ifdef code='ca_entities.address.country'><ifdef code='ca_entities.address.city|ca_entities.address.stateprovince'>, </ifdef>^ca_entities.address.country</ifdef></div></ifdef>",
				#image_format = cover, # --- contain or cover - default is cover
				list_format = text, # --- image or text where text is a simple grid of cards with no media

			},
			images = {
				result_caption = "<div class='card-title'><div class='fw-medium lh-sm fs-5'><l>^ca_entities.preferred_labels</l></div></div><ifdef code='ca_entities.address'><div class='fs-6'><l><ifdef code='ca_entities.address.city'>^ca_entities.address.city</ifdef><ifdef code='ca_entities.address.stateprovince'><ifdef code='ca_entities.address.city'>, </ifdef>^ca_entities.address.stateprovince</ifdef><ifdef code='ca_entities.address.country'><ifdef code='ca_entities.address.city|ca_entities.address.stateprovince'>, </ifdef>^ca_entities.address.country</ifdef></l></div></ifdef>",
				image_format = contain, # --- contain or cover - default is cover
			},
		},
		
		sortBy = {
			Relevance = _natural,
			Identifier = ca_entities.idno,
			Name = ca_entity_labels.surname;ca_entity_labels.forename
		},
#		options = {
#			selectMediaUsingRelationshipTypes = [relationshipType],
#			selectMediaUsingTypes = [objectType]
#		},
		generalSearchOptions = {
			resultCaption = "<l class='pt-3 pb-4 px-3 d-flex align-items-center justify-content-center bg-body-tertiary h-100 w-100 text-black'>^ca_entities.preferred_labels.displayname</l>",
			searchView = general_list_results_html.php,
			numItemsToShow = 7,
			sortBy = _natural,
			sortDirection = asc,
		}
		
	}
}
