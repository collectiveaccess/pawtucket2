# --- text for Browse menu item, default is "Browse" 
browse_menu_button_text = Explore

# --- Render browse menu as nav links? default is dropdown
render_browse_menu_as_links = 0

# --- default number of results per page/ajax load
defaultHitsPerBlock = 36

# --- set if you don't want the browse menu to be preloaded with facets for the first browse type on open
dontPreloadBrowseMenu = 1

ca_entities = {
	name = _("Entities"),
	facets = {
		administration_decade_facet = {
			type = normalizedDates,
			element_code = dates,
			normalization = decades,
			
			group_mode = none,
			
			label_singular = _("decade"),
			label_plural = _("decades"),
			facet_groups = [administrations]
		},
		administration_year_facet = {
			type = normalizedDates,
			element_code = dates,
			normalization = years,
			
			requires = administration_decade_facet,
			
			group_mode = none,
			
			label_singular = _("year"),
			label_plural = _("years"),
			facet_groups = [administrations]
		},	
		administration_facet = {
			# 'type' can equal authority, attribute, fieldList, normalizedDates
			type = authority,		
			table = ca_entities,
			relationship_table = ca_entities_x_entities,
			restrict_to_types = [administration],
			
			individual_group_display = 1,
			
			groupings = {
				label = _("Name"), 
				relationship_types = _("Role"),
				type = _("Type")
			},
			group_mode = alphabetical,
			natural_sort = 0,
			order_by_label_fields = [surname, forename, middlename],
			
			indefinite_article = an,
			label_singular = _("administration"),
			label_plural = _("administration"),
			facet_groups = [workers]
		},
		service_years_decade_facet = {
			type = normalizedDates,
			element_code = service_years,
			normalization = decades,
			
			group_mode = none,
			
			label_singular = _("decade in President's House"),
			label_plural = _("decades in President's House"),
			facet_groups = [workers]
		},
		service_years_year_facet = {
			type = normalizedDates,
			element_code = service_years,
			normalization = years,
			
			requires = service_years_decade_facet,
			
			group_mode = none,
			
			label_singular = _("year in President's House"),
			label_plural = _("years in President's House"),
			facet_groups = [workers]
		},
		period_facet = {
			type = attribute,
			element_code = ca_entities.historical_periods,
			
			group_mode = alphabetical,
			
			label_singular = _("Period in U.S. History"),
			label_plural = _("Periods in U.S. History"),
			facet_groups = [workers]
		},
		occupation_facet = {
			type = attribute,
			element_code = ca_entities.occupation,
			
			group_mode = alphabetical,
			
			label_singular = _("Occupation"),
			label_plural = _("Occupation"),
			facet_groups = [workers]
		},
		birthplace_facet = {
			type = attribute,
			element_code = ca_entities.birthplace,
			
			group_mode = alphabetical,
			
			label_singular = _("Birthplace"),
			label_plural = _("Birthplaces"),
			facet_groups = [workers]
		},
		race_ethnicity_facet = {
			type = attribute,
			element_code = ca_entities.race_ethnicity,
			
			group_mode = alphabetical,
			
			label_singular = _("Race/Ethnicity"),
			label_plural = _("Races/Ethnicities"),
			facet_groups = [workers]
		},
		legal_status_facet = {
			type = attribute,
			element_code = ca_entities.legal_status,
			
			group_mode = alphabetical,
			
			label_singular = _("Legal Status"),
			label_plural = _("Legal Status"),
			facet_groups = [workers]
		}
	}
}